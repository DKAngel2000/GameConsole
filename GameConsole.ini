; GameConsole settings. Edit values and restart the game. Values are true/false unless noted.
; Missing keys fall back to the defaults shown here. Delete this file to regenerate it.

; ===== Console window =====
; Show the console window. false = hidden (the saved log file keeps working)
ConsoleVisible=true
; Allocate a console window at all. false = no console, log-file-only mode
; (diagnostic for compat-shim conflicts where console allocation misbehaves)
AllocConsole=true
; Title of the console window
ConsoleTitle=Game Debug Console
; Console buffer width, 80-1000. Wide = long lines do not wrap in the saved log
ConsoleCols=300
; Console buffer height, 200-30000. When nearly full it is wiped after saving
ConsoleRows=20000
; Prefix tagged lines with HH:mm:ss.fff
ShowTimestamps=true
; Colour the tags (ANSI codes)
ShowColors=true
; Print the tag legend at startup
ShowLegend=true
; Print exe path, command line, working directory and OS at startup
ShowStartupInfo=true
; On an unhandled crash, freeze the process so the console stays readable.
; Keep this false when testing: a frozen process looks exactly like a hang.
HoldOnCrash=false

; ===== Saving =====
; Save the console to a file
SaveLogFile=true
; Folder for saved logs. Empty = a logs folder next to GameConsole.dll
LogDirectory=
; Save lines written by GameConsole (the ones with a [tag])
SaveTaggedLines=true
; Save lines written straight to the console by the game or mods (marked [raw])
SaveRawLines=true
; Write GameConsole.log in %TEMP% (startup steps, handy if something fails to start)
WriteTraceFile=true
; Write GameConsole_crash.log in %TEMP% (crash reports)
WriteCrashFile=true

; ===== Capture (these only listen or redirect output, nothing is patched) =====
; Listen for OutputDebugString calls
CaptureOutputDebugString=true
; Point the game's printf/stdout/stderr (UCRT) at the console
RedirectCrt=true
; Point the process standard handles at the console (Win32 writes to stdout/stderr)
RedirectStdHandles=true
; Install an unhandled-exception filter that logs the final crash
EnableCrashHandler=true

; ===== Categories shown. false hides the category from the console AND the saved file =====
; [ODS] OutputDebugString text
Show_ODS=true
; [file.log] tailed log files
Show_LogFiles=true
; [MOD] DLL load/unload
Show_Modules=true
; [CRASH] access violations, stack overflows and similar
Show_Crash=true
; [EXC] other exceptions
Show_Exceptions=true
; [HOOK] hooked Nt* API activity (file reads/writes, memory-protection changes)
Show_Hooks=true
; [THR] threads
Show_Threads=true
; [MEM] new executable memory
Show_Memory=true
; [NET] TCP connections
Show_Network=true
; [FS] files created/deleted/renamed
Show_FileSystem=true
; [HB] periodic counts
Show_Heartbeat=true
; [SD] KUSER_SHARED_DATA changes (the Dr-armed mailbox)
Show_SharedData=true
; [SYS]/[KRNL]/[SVC] hypervisor, kernel modules and services
Show_System=true
; [INFO] startup information
Show_Info=true
; [console] GameConsole's own status messages
Show_Console=true

; ===== OutputDebugString =====
; Name the module that called OutputDebugString in the tag
OdsShowCaller=true

; ===== Log files =====
; Follow *.log files in the game folder while the game runs
TailLogFiles=true
; Also follow Unity Player.log under AppData LocalLow
TailUnityPlayerLog=true
; Also follow .txt files with log in the name
TailTxtFilesWithLogInName=true
; true = only show lines added after the file was first seen
TailSkipExistingContent=false
; How many subfolder levels under the game folder to search (0-10)
LogScanDepth=3

; ===== Modules =====
; List the modules already loaded at startup
ModulesPresent=true
; Log DLLs as they load
ModulesLoaded=true
; Log DLLs as they unload
ModulesUnloaded=true
; Hide DLLs from the Windows folder (shows only game and mod DLLs)
ModulesHideSystem=false
; Show the full path of each present module
ModulesShowPath=true

; ===== Exceptions =====
; Log non-crash exceptions (C++ throws, breakpoints and so on)
LogAllExceptions=true
; Log access violations and similar when they are thrown (first chance)
ExceptionCrashCodes=true
; Include a stack trace in crash reports
ExceptionStackTrace=true
; Include C++ throws
ExceptionCpp=true
; Include .NET CLR exceptions
ExceptionClr=true
; Include breakpoints and single-steps
ExceptionBreakpoints=true
; Include any other exception code
ExceptionOther=true
; Cap on first-chance crash-code reports (some are harmless)
MaxCrashReports=25
; Cap on other exception reports
MaxOtherExceptions=500

; ===== Threads =====
; Watch threads
MonThreads=true
; List threads that already exist at startup
ThreadsPresent=true
; Log new threads with their start module
ThreadsStarted=true
; Log threads that exit
ThreadsExited=true

; ===== Executable memory =====
; Watch for executable memory not owned by any DLL or EXE
MonMemory=true
; Print how many such regions exist at startup
MemoryBaseline=true

; ===== Network =====
; Watch this process's IPv4 TCP connections
MonNetwork=true
; Log new connections
NetNew=true
; Log connection state changes
NetChanges=true
; Log connections that close
NetClosed=true

; ===== Files =====
; Watch the game folder (recursive) for created/deleted/renamed files
MonGameFolder=true
; Watch the %TEMP% folder too
MonTempDir=true
; Log created files and folders
FsCreated=true
; Log deleted files and folders
FsDeleted=true
; Log renamed files and folders
FsRenamed=true

; ===== Heartbeat =====
; Print thread/handle/memory counts periodically
MonHeartbeat=true
; Seconds between heartbeats (1-3600)
HeartbeatSeconds=10

; ===== Hooks (opt-in: instrument import tables + the KERNELBASE interposition layer to log calls - no code bytes are ever patched) =====
; Install lightweight ntdll hooks. Set false for the old purely passive design
HookApis=true
; Log NtReadFile calls (file reads)
HookFileReads=true
; Log NtCreateFile / NtOpenFile / NtWriteFile calls
HookFileWrites=true
; Log NtProtectVirtualMemory calls when execute rights are involved (code patching)
HookMemPatches=true
; true = skip callers inside the Windows folder (game/mod DLLs only)
HookOnlyGameModules=true
; Comma-separated module names whose IAT is instrumented, e.g. artifact.dll,dse.dll
; Empty = no per-module IAT hooks, but the KERNELBASE interposition layer still
; runs and logs ALL callers - the right setting for a game/mod you do not know yet.
; A name that is not loaded yet (a mod's helper DLL loads after this one) is
; retried each heartbeat and shows as "not loaded yet" then "loaded late -
; instrumented now"; a hidden module that is in no loader list (dse.dll) is
; instrumented by address as soon as it calls a hooked API
HookModules=artifact.dll,dse.dll
; Also instrument the game executable's own import table (file/registry/memory
; and exception-handler imports live there). OFF by default and best left off
; for a Denuvo-protected exe: the protection checks its own imports, and
; repointing them can make it fail its own tamper check - which manifests as
; "Corrupt pak index detected" in Unreal titles (both PB0 and FFRS). The
; KERNELBASE layer still covers calls that go through KERNELBASE
HookExe=false
; Wait this many ms after startup before the first IAT write. 0 = install
; immediately, which is right when the mod loader brings this DLL in. Set it
; (e.g. 8000) when the DLL is injected at instruction zero with tools\EarlyLoad.c:
; a protected module that finds its import table repointed BEFORE its own startup
; fails its tamper check and aborts the session (Denuvo's "something went wrong"
; dialog, linking to support.codefusion.technology/antitamper). Everything
; read-only - surveys, module log, the DSE sampling - still runs from t=0
HookDelayMs=0
; Instrument the import table of a module that is in no loader list (found only
; by caller address, e.g. a protection helper). OFF by default: such a module
; hides itself for a reason, and repointing its imports while it runs has killed
; the game at that exact moment on every launch that reached it. It is still
; detected, censused and reported when this is false
HookHiddenModules=false
; Allow the legacy ntdll stub patching (patching ntdll's own code) when
; HookModules is empty. Leave false: it races another mod's own ntdll hooks
; into a crash. It exists only so an emptied ini can never silently enable it
HookLegacyNtdll=false
; Cap on hook log lines so a chatty caller cannot flood the console
MaxHookReports=10000
; Read-only binding census of EVERY loaded module's import table (startup + new modules only):
; tallies targets, and details imports that resolved into NON-IMAGE memory = Denuvo-style
; manual-mapped shadow DLLs or unlinked code. Set false to only census HookModules
CensusAll=true
; Cap on detail lines from the all-module census
CensusAllMax=1000
; GetProcAddress calls made through HookModules' import table are logged AND return a
; logging thunk (counts calls + last caller, reported each heartbeat as "gpa" lines).
; Set false if a game verifies resolved pointers against its own tables
GpaThunks=true
; The KERNELBASE interposition layer also covers registry writes (NtCreateKey /
; NtSetValueKey): [HOOK] regkey when a key was CREATED (not merely opened) and
; [HOOK] regset for a written value, with the resolved key path, value name and
; data - which is how a service or kernel driver is registered
; (ImagePath / Type / Start).
;
; Read-only survey of the manually-mapped shadow DLLs' exports (trampolines into the
; protected image?) plus a prologue decode of executable non-image regions
ScanShadow=true
; Shadow survey: detail lines per shadow module (summary is always written). The old
; global budget let one module eat every line - now each module gets its own quota
ShadowDetailMax=24
; Walk the PEB's real loader list and report modules toolhelp32 cannot see (a
; manually-mapped DLL with a hand-built loader entry) plus loader entries whose
; memory is not MEM_IMAGE. Read-only
ScanLdr=true
; Read-only ntdll survey: report EVERY export whose entry is a jump instead of
; a clean syscall stub, classified - hooked by another module / same-image
; alias / non-export same-image target (cave). Runs at startup and re-runs each
; heartbeat (new sites only). Never writes anything
ScanOtherHooks=true
; Max [SCAN] detail lines per image per survey
ScanOtherHooksMax=400
; Report the process's real vectored-exception-handler chain ([EH] lines): the
; handlers in the order Windows calls them, named module+offset. Read-only walk,
; anchored on GameConsole's own registration (a pass-through VEH is installed as
; the anchor when this is on). Later VEH/UEH registrations made through an
; instrumented import table show as [HOOK] "veh add / veh remove / ueh set".
ScanEh=true
; Enumerate Windows services read-only and report the ones matching ServiceWatch
; (name / display name / binary path), plus ones that appear or change state
ScanServices=true
; Enumerate loaded kernel modules read-only and report the ones matching
; ServiceWatch - this is where a protection's driver/hypervisor shows up
ScanDrivers=true
; Comma-separated keywords, matched case-insensitively against service names,
; display names, service binary paths, kernel driver paths and the CPUID
; hypervisor vendor. hyperkd / simplesvm are the known Denuvo hypervisor driver
; names; artifact.dll carries the "hyperkd" string and starts the driver
; through the service control manager (CreateServiceW/StartServiceW), registering
; it as a kernel driver service (on Planet Zoo 2 the service key is "artifact"
; while the file is Artifact_Intel\hyperkd.sys)
ServiceWatch=denuvo,hypervisor,hvservice,hyperkd,simplesvm,vgk,vgc,vanguard,easyanticheat,battleye,beservice,bedaisy,nprotect,gameguard,xigncode,arxan,vmprotect,themis,xtrap
; Also list EVERY service and EVERY loaded kernel module, not just watch matches
ServiceWatchAll=false
; Watch the tail of KUSER_SHARED_DATA (0x7FFE0FE0..0x1000) for changes - artifact arms
; Dr3 there, so it may be a handshake mailbox. Logged as [SD]
WatchSharedData=true
; Report committed non-image pages carrying PAGE_GUARD or PAGE_NOACCESS (tripwires)
MemGuardScan=true
; Also list low-address (thread-stack/heap) guard pages - usually noise
MemGuardAll=false
; Write a machine-readable GameConsole_pid<pid>.csv next to the log
CsvExport=true
